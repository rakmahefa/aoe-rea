name: REA binary analysis

on:
  workflow_dispatch:
    inputs:
      target_path:
        description: Tracked EXE or DLL path to analyze
        required: true
        type: string
        default: "retro/exe et dll/age3y.exe"
      function_selector:
        description: Override the automatic PE entry-point dossier with a function name or address
        required: false
        type: string
        default: ""
      search_query:
        description: Optional term to search the binary for gameplay-related strings and references
        required: false
        type: string
        default: ""
      xref_address:
        description: Optional address to inspect cross-references to/from (for example 0xc36e20)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: rea-analysis-${{ github.ref }}-${{ inputs.target_path }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze selected binary with REA + Ghidra
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REA_VERSION: "6.4.0"
      GHIDRA_VERSION: "12.1.4"
      GHIDRA_ARCHIVE: "ghidra_12.1.4_PUBLIC_20260921.zip"
      GHIDRA_URL: "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
      GHIDRA_HEADLESS_MAXMEM: "4G"
      REPORT_DIR: "rea-analysis-results"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate selected target
        id: target
        shell: bash
        env:
          TARGET_PATH: ${{ inputs.target_path }}
        run: |
          set -euo pipefail

          if [[ -z "$TARGET_PATH" || "$TARGET_PATH" == /* || "$TARGET_PATH" == *$'\n'* ]]; then
            echo "::error::Provide a tracked repository-relative EXE or DLL path."
            exit 1
          fi

          case "$TARGET_PATH" in
            "."|".."|../*|*/../*|*/..)
              echo "::error::Parent-directory traversal is not allowed."
              exit 1
              ;;
          esac

          case "${TARGET_PATH,,}" in
            *.exe|*.dll) ;;
            *)
              echo "::error::Only .exe and .dll targets are supported by this workflow."
              exit 1
              ;;
          esac

          git ls-files --error-unmatch -- "$TARGET_PATH" >/dev/null || {
            echo "::error::Target is not a tracked file in this checkout: $TARGET_PATH"
            exit 1
          }

          test -f "$TARGET_PATH" || {
            echo "::error::Target file does not exist: $TARGET_PATH"
            exit 1
          }

          resolved_path="$(realpath -- "$TARGET_PATH")"
          case "$resolved_path" in
            "$GITHUB_WORKSPACE"/*) ;;
            *)
              echo "::error::Resolved target is outside the repository workspace."
              exit 1
              ;;
          esac

          echo "path=$resolved_path" >> "$GITHUB_OUTPUT"
          echo "relative_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"

      - name: Test PE entry-point parser
        run: python3 -m unittest discover -s tests -p 'test_pe_entry_point.py' -v

      - name: Set up Java for Ghidra
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js for REA
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache Ghidra
        id: ghidra-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ghidra-install
          key: ghidra-${{ runner.os }}-12.1.4-public-20260921-jdk21

      - name: Download Ghidra
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghidra-download" "$RUNNER_TEMP/ghidra-install"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$GHIDRA_URL" \
            --output "$RUNNER_TEMP/ghidra-download/$GHIDRA_ARCHIVE"
          unzip -q "$RUNNER_TEMP/ghidra-download/$GHIDRA_ARCHIVE" \
            -d "$RUNNER_TEMP/ghidra-install"

      - name: Configure Ghidra
        shell: bash
        run: |
          set -euo pipefail
          ghidra_dir="$(find "$RUNNER_TEMP/ghidra-install" -mindepth 1 -maxdepth 1 \
            -type d -name 'ghidra_*_PUBLIC' -print -quit)"
          if [[ -z "$ghidra_dir" || ! -x "$ghidra_dir/support/analyzeHeadless" ]]; then
            echo "::error::Ghidra installation does not contain support/analyzeHeadless."
            exit 1
          fi

          echo "GHIDRA_INSTALL_DIR=$ghidra_dir" >> "$GITHUB_ENV"
          echo "Ghidra $GHIDRA_VERSION installed at $ghidra_dir"

      - name: Install REA CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "rea-agents@$REA_VERSION"
          mkdir -p "$REPORT_DIR"
          rea --version > "$REPORT_DIR/rea-version.txt"
          java -version 2> "$REPORT_DIR/java-version.txt"

      - name: Check REA and Ghidra readiness
        shell: bash
        run: |
          set -euo pipefail
          rea doctor --provider ghidra --json \
            > "$REPORT_DIR/doctor.json" \
            2> "$REPORT_DIR/doctor.stderr.log"
          jq -e . "$REPORT_DIR/doctor.json" > /dev/null

      - name: Prepare metadata for focused queries
        if: ${{ inputs.search_query != '' || inputs.xref_address != '' }}
        shell: bash
        env:
          TARGET_PATH: ${{ steps.target.outputs.path }}
          TARGET_RELATIVE_PATH: ${{ steps.target.outputs.relative_path }}
        run: |
          set -euo pipefail
          target_sha="$(sha256sum "$TARGET_PATH" | awk '{print $1}')"
          jq -n \
            --arg target "$TARGET_RELATIVE_PATH" \
            --arg sha256 "$target_sha" \
            --arg commit "$GITHUB_SHA" \
            --arg rea_version "$REA_VERSION" \
            --arg ghidra_version "$GHIDRA_VERSION" \
            --arg analysed_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              target_path: $target,
              target_sha256: $sha256,
              source_commit: $commit,
              rea_version: $rea_version,
              ghidra_version: $ghidra_version,
              analysed_at_utc: $analysed_at,
              purpose: "Static native search/cross-reference analysis; not a Linux port or recompilation."
            }' > "$REPORT_DIR/metadata.json"

      - name: Analyze selected binary
        if: ${{ (inputs.search_query == '' && inputs.xref_address == '') || inputs.function_selector != '' }}
        shell: bash
        env:
          TARGET_PATH: ${{ steps.target.outputs.path }}
          TARGET_RELATIVE_PATH: ${{ steps.target.outputs.relative_path }}
          FUNCTION_SELECTOR: ${{ inputs.function_selector }}
        run: |
          set -euo pipefail

          rea analyze "$TARGET_PATH" --provider ghidra --json \
            > "$REPORT_DIR/analysis.json" \
            2> "$REPORT_DIR/analysis.stderr.log"
          jq -e . "$REPORT_DIR/analysis.json" > /dev/null

          target_sha="$(sha256sum "$TARGET_PATH" | awk '{print $1}')"
          jq -n \
            --arg target "$TARGET_RELATIVE_PATH" \
            --arg sha256 "$target_sha" \
            --arg commit "$GITHUB_SHA" \
            --arg rea_version "$REA_VERSION" \
            --arg ghidra_version "$GHIDRA_VERSION" \
            --arg analysed_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              target_path: $target,
              target_sha256: $sha256,
              source_commit: $commit,
              rea_version: $rea_version,
              ghidra_version: $ghidra_version,
              analysed_at_utc: $analysed_at,
              purpose: "Static native binary analysis; not a Linux port or recompilation."
            }' > "$REPORT_DIR/metadata.json"

          {
            printf '%s\n' \
              '## REA binary analysis' \
              '' \
              "- **Target:** \`$TARGET_RELATIVE_PATH\`" \
              "- **SHA-256:** \`$target_sha\`" \
              "- **REA:** \`$REA_VERSION\`" \
              "- **Ghidra:** \`$GHIDRA_VERSION\`" \
              "- **Source commit:** \`$GITHUB_SHA\`" \
              '' \
              'The full JSON report and provider diagnostics are available in the `rea-analysis` workflow artifact.' \
              'This job analyzes a binary; it does not decompile the entire game into source or build a native Linux executable.'
          } >> "$GITHUB_STEP_SUMMARY"

          python3 scripts/pe_entry_point.py "$TARGET_PATH" > "$REPORT_DIR/entry-point.json"
          entry_point_va="$(jq -r '.entry_point_va // empty' "$REPORT_DIR/entry-point.json")"
          selected_function="$FUNCTION_SELECTOR"
          selection_source="manual input"

          if [[ -z "$selected_function" ]]; then
            selected_function="$entry_point_va"
            selection_source="PE optional-header entry point"
          fi

          if [[ -n "$FUNCTION_SELECTOR" && ( "$FUNCTION_SELECTOR" == -* || "$FUNCTION_SELECTOR" == *$'\n'* || "$FUNCTION_SELECTOR" == *$'\r'* || "${#FUNCTION_SELECTOR}" -gt 200 ) ]]; then
            echo "::error::Function selector must be a short single-line function name or address, not an option."
            exit 1
          fi

          if [[ -n "$selected_function" ]]; then
            jq -n \
              --arg selector "$selected_function" \
              --arg source "$selection_source" \
              '{selector: $selector, source: $source, status: "pending"}' \
              > "$REPORT_DIR/function-selection.json"

            if [[ -n "$FUNCTION_SELECTOR" ]]; then
              # Explicit user selection is authoritative: fail the run if it cannot be analyzed.
              rea function "$TARGET_PATH" "$selected_function" --provider ghidra --json \
                > "$REPORT_DIR/function.json" \
                2> "$REPORT_DIR/function.stderr.log"
              jq -e . "$REPORT_DIR/function.json" > /dev/null
              function_status="success"
            else
              # The PE entry may be a CRT/startup stub rather than a useful recovered function.
              # Keep the binary overview even if REA cannot produce this optional dossier.
              set +e
              rea function "$TARGET_PATH" "$selected_function" --provider ghidra --json \
                > "$REPORT_DIR/function.json" \
                2> "$REPORT_DIR/function.stderr.log"
              function_exit_code=$?
              set -e

              if [[ "$function_exit_code" -eq 0 ]] && jq -e . "$REPORT_DIR/function.json" > /dev/null 2>&1; then
                function_status="success"
              else
                function_status="not_resolved"
                rm -f "$REPORT_DIR/function.json"
                echo "::warning::REA could not produce a function dossier for the declared PE entry point $selected_function; the overview report is still available."
              fi
            fi

            jq --arg status "$function_status" '. + {status: $status}' \
              "$REPORT_DIR/function-selection.json" > "$REPORT_DIR/function-selection.tmp.json"
            mv "$REPORT_DIR/function-selection.tmp.json" "$REPORT_DIR/function-selection.json"
            printf '%s\n' "- Function dossier selection: $selected_function ($selection_source; $function_status)" \
              >> "$GITHUB_STEP_SUMMARY"

            # Explore a small, bounded set of direct internal callees.
            # These candidates are starting points, not assumed game entry points.
            mkdir -p "$REPORT_DIR/callees"
            : > "$REPORT_DIR/callees/results.ndjson"

            if [[ "$function_status" == "success" && -f "$REPORT_DIR/function.json" ]]; then
              mapfile -t callee_candidates < <(
                jq -r '
                  [
                    .normalized_result.callees[]?
                    | select(
                        (.classification.external != true)
                        and (.classification.thunk != true)
                        and (.address | type == "string" and test("^0x[0-9a-fA-F]+$"))
                        and ((.name // "") | startswith("__SEH_") | not)
                        and ((.name // "") != "__amsg_exit")
                      )
                  ]
                  | reduce .[] as $callee (
                      [];
                      if any(.[]; .address == $callee.address)
                      then .
                      else . + [$callee]
                      end
                    )
                  | .[:4][]
                  | [.address, (.name // "unknown")]
                  | @tsv
                ' "$REPORT_DIR/function.json"
              )

              for candidate in "${callee_candidates[@]}"; do
                callee_address="$(printf '%s' "$candidate" | cut -f1)"
                callee_name="$(printf '%s' "$candidate" | cut -f2-)"
                safe_name="$(printf '%s' "$callee_name" | tr -cs '[:alnum:]_-' '_' | cut -c1-60)"
                report_file="callees/${callee_address#0x}_${safe_name}.json"
                stderr_file="$REPORT_DIR/callees/${callee_address#0x}_${safe_name}.stderr.log"

                set +e
                rea function "$TARGET_PATH" "$callee_address" --provider ghidra --json \
                  > "$REPORT_DIR/$report_file" \
                  2> "$stderr_file"
                callee_exit_code=$?
                set -e

                if [[ "$callee_exit_code" -eq 0 ]] && jq -e . "$REPORT_DIR/$report_file" > /dev/null 2>&1; then
                  callee_status="success"
                else
                  callee_status="not_resolved"
                  rm -f "$REPORT_DIR/$report_file"
                  echo "::warning::REA could not produce a dossier for direct callee $callee_name ($callee_address)."
                fi

                jq -n \
                  --arg address "$callee_address" \
                  --arg name "$callee_name" \
                  --arg status "$callee_status" \
                  --arg report "$report_file" \
                  --arg stderr "callees/${callee_address#0x}_${safe_name}.stderr.log" \
                  '{address: $address, name: $name, status: $status, report: (if $status == "success" then $report else null end), stderr: $stderr}' \
                  >> "$REPORT_DIR/callees/results.ndjson"
              done

              jq -s \
                --arg source_address "$selected_function" \
                --arg source_kind "$selection_source" \
                '{source_address: $source_address, source_kind: $source_kind, candidates_analyzed: length, results: .}' \
                "$REPORT_DIR/callees/results.ndjson" > "$REPORT_DIR/callees/manifest.json"

              callee_successes="$(jq '[.results[] | select(.status == "success")] | length' "$REPORT_DIR/callees/manifest.json")"
              echo "- Direct callee dossiers: $callee_successes succeeded out of ${#callee_candidates[@]} attempted (maximum 4)." >> "$GITHUB_STEP_SUMMARY"
            else
              jq -n \
                --arg source_address "$selected_function" \
                --arg source_kind "$selection_source" \
                '{source_address: $source_address, source_kind: $source_kind, candidates_analyzed: 0, results: [], status: "skipped", reason: "The source function dossier was not available."}' \
                > "$REPORT_DIR/callees/manifest.json"
              echo "- Direct callee dossiers: skipped (source function dossier unavailable)." >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -f "$REPORT_DIR/callees/results.ndjson"
          else
            jq -n \
              '{selector: null, source: "PE optional-header entry point", status: "skipped", reason: "The PE declares no entry-point RVA and no manual function selector was supplied."}' \
              > "$REPORT_DIR/function-selection.json"
            echo "::warning::The PE declares no entry point and no manual function selector was supplied; skipping the optional function dossier."
            echo "- Function dossier: skipped (no declared PE entry point)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Search binary for gameplay clues
        if: ${{ inputs.search_query != '' }}
        shell: bash
        env:
          TARGET_PATH: ${{ steps.target.outputs.path }}
          TARGET_RELATIVE_PATH: ${{ steps.target.outputs.relative_path }}
          SEARCH_QUERY: ${{ inputs.search_query }}
        run: |
          set -euo pipefail

          if [[ -z "$SEARCH_QUERY" || "$SEARCH_QUERY" == -* || "$SEARCH_QUERY" == *$'\n'* || "$SEARCH_QUERY" == *$'\r'* || "${#SEARCH_QUERY}" -gt 200 ]]; then
            echo "::error::Search query must be a short, single-line term, not an option."
            exit 1
          fi

          rea search "$TARGET_PATH" "$SEARCH_QUERY" --provider ghidra --json \
            > "$REPORT_DIR/search.json" \
            2> "$REPORT_DIR/search.stderr.log"
          jq -e . "$REPORT_DIR/search.json" > /dev/null
          printf '%s\n' "- Gameplay clue search: `$SEARCH_QUERY` (see `search.json`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect address cross-references
        if: ${{ inputs.xref_address != '' }}
        shell: bash
        env:
          TARGET_PATH: ${{ steps.target.outputs.path }}
          XREF_ADDRESS: ${{ inputs.xref_address }}
        run: |
          set -euo pipefail

          if [[ ! "$XREF_ADDRESS" =~ ^0[xX][0-9a-fA-F]{1,8}$ ]]; then
            echo "::error::xref_address must be a PE32 virtual address such as 0xc36e20."
            exit 1
          fi

          rea xrefs "$TARGET_PATH" "$XREF_ADDRESS" --provider ghidra --json \
            > "$REPORT_DIR/xrefs.json" \
            2> "$REPORT_DIR/xrefs.stderr.log"
          jq -e . "$REPORT_DIR/xrefs.json" > /dev/null
          printf '%s\n' "- Cross-references for `$XREF_ADDRESS`: see `xrefs.json`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload REA analysis report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rea-analysis
          path: rea-analysis-results/
          if-no-files-found: warn
          retention-days: 14
