name: REA one-shot adjacent instruction probe

on:
  push:
    branches:
      - research/inspect-kbcanpath2-8827d7

permissions:
  contents: read

concurrency:
  group: rea-probe-882816
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect next kbCanPath2 instruction
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REA_VERSION: "6.4.0"
      GHIDRA_VERSION: "12.1.4"
      GHIDRA_ARCHIVE: "ghidra_12.1.4_PUBLIC_20260921.zip"
      GHIDRA_URL: "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
      REPORT_DIR: "rea-analysis-results"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate target
        shell: bash
        run: |
          set -euo pipefail
          target="retro/exe et dll/age3y.exe"
          git ls-files --error-unmatch -- "$target" >/dev/null
          test -f "$target"
          echo "TARGET_PATH=$GITHUB_WORKSPACE/$target" >> "$GITHUB_ENV"
          echo "TARGET_RELATIVE_PATH=$target" >> "$GITHUB_ENV"

      - name: Test PE entry-point parser
        run: python3 -m unittest discover -s tests -p 'test_pe_entry_point.py' -v

      - name: Set up Java for Ghidra
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js for REA
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache Ghidra
        id: ghidra-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ghidra-install
          key: ghidra-${{ runner.os }}-12.1.4-public-20260921-jdk21

      - name: Download Ghidra
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghidra-download" "$RUNNER_TEMP/ghidra-install"
          curl --fail --location --retry 3 --retry-delay 2 "$GHIDRA_URL" \
            --output "$RUNNER_TEMP/ghidra-download/$GHIDRA_ARCHIVE"
          unzip -q "$RUNNER_TEMP/ghidra-download/$GHIDRA_ARCHIVE" \
            -d "$RUNNER_TEMP/ghidra-install"

      - name: Configure Ghidra
        shell: bash
        run: |
          set -euo pipefail
          ghidra_dir="$(find "$RUNNER_TEMP/ghidra-install" -mindepth 1 -maxdepth 1 \
            -type d -name 'ghidra_*_PUBLIC' -print -quit)"
          test -n "$ghidra_dir"
          test -x "$ghidra_dir/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$ghidra_dir" >> "$GITHUB_ENV"

      - name: Install REA CLI and check readiness
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "rea-agents@$REA_VERSION"
          mkdir -p "$REPORT_DIR"
          rea --version > "$REPORT_DIR/rea-version.txt"
          java -version 2> "$REPORT_DIR/java-version.txt"
          rea doctor --provider ghidra --json > "$REPORT_DIR/doctor.json" \
            2> "$REPORT_DIR/doctor.stderr.log"
          jq -e . "$REPORT_DIR/doctor.json" > /dev/null

      - name: Prepare evidence metadata
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(sha256sum "$TARGET_PATH" | awk '{print $1}')"
          jq -n \
            --arg target "$TARGET_RELATIVE_PATH" \
            --arg sha256 "$target_sha" \
            --arg commit "$GITHUB_SHA" \
            --arg rea_version "$REA_VERSION" \
            --arg ghidra_version "$GHIDRA_VERSION" \
            --arg analysed_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              target_path: $target,
              target_sha256: $sha256,
              source_commit: $commit,
              rea_version: $rea_version,
              ghidra_version: $ghidra_version,
              analysed_at_utc: $analysed_at,
              purpose: "Single-address static native instruction inspection; not a Linux port or recompilation."
            }' > "$REPORT_DIR/metadata.json"

      - name: Inspect native instruction at 0x882816
        shell: bash
        run: |
          set -euo pipefail
          rea inspect-native-instruction "$TARGET_PATH" "0x882816" --provider ghidra --json \
            > "$REPORT_DIR/instruction.json" \
            2> "$REPORT_DIR/instruction.stderr.log"
          jq -e . "$REPORT_DIR/instruction.json" > /dev/null
          printf '%s\n' '- Native instruction at `0x882816`: see `instruction.json`' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload REA analysis report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rea-analysis
          path: rea-analysis-results/
          if-no-files-found: warn
          retention-days: 14
