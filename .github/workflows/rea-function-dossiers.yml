name: Decompile functions in parallel batches of 100

on:
  workflow_dispatch:
  push:
    branches:
      - agent/decompiler-batches-100-20261017
    paths:
      - 'scripts/ghidra/DecompileFunctionDossiers.java'
      - '.github/workflows/rea-function-dossiers.yml'
      - 'retro/exe et dll/age3y.exe'
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: read

concurrency:
  group: aoe-rea-function-dossiers
  cancel-in-progress: false

jobs:
  decompile:
    name: Generate dossiers using 100-function batches
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GHIDRA_VERSION: "12.1.4"
      GHIDRA_ARCHIVE: "ghidra_12.1.4_PUBLIC_20260921.zip"
      GHIDRA_URL: "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
      REPORT_DIR: "function-dossiers"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify target and capture exact identity
        shell: bash
        run: |
          set -euo pipefail
          target="retro/exe et dll/age3y.exe"
          git ls-files --error-unmatch -- "$target" >/dev/null
          test -f "$target"
          echo "TARGET_PATH=$GITHUB_WORKSPACE/$target" >> "$GITHUB_ENV"
          echo "TARGET_RELATIVE_PATH=$target" >> "$GITHUB_ENV"
          sha256sum "$target"
          python3 -m unittest discover -s tests -p 'test_pe_entry_point.py' -v

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Ghidra
        id: ghidra-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ghidra-install
          key: ghidra-${{ runner.os }}-12.1.4-public-20260921-jdk21

      - name: Download Ghidra
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghidra-download" "$RUNNER_TEMP/ghidra-install"
          curl --fail --location --retry 3 --retry-delay 2 "$GHIDRA_URL" --output "$RUNNER_TEMP/ghidra-download/$GHIDRA_ARCHIVE"
          unzip -q "$RUNNER_TEMP/ghidra-download/$GHIDRA_ARCHIVE" -d "$RUNNER_TEMP/ghidra-install"

      - name: Resolve Ghidra installation
        shell: bash
        run: |
          set -euo pipefail
          ghidra_dir="$(find "$RUNNER_TEMP/ghidra-install" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*_PUBLIC' -print -quit)"
          test -x "$ghidra_dir/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$ghidra_dir" >> "$GITHUB_ENV"

      - name: Run parallel decompilation in batches of 100 and create per-function notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR" "$RUNNER_TEMP/ghidra-dossier-project"
          target_sha="$(sha256sum "$TARGET_PATH" | awk '{print $1}')"
          printf '%s\n' "$target_sha" > "$REPORT_DIR/target-sha256.txt"
          printf '%s\n' "$GHIDRA_VERSION" > "$REPORT_DIR/ghidra-version.txt"

          "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
            "$RUNNER_TEMP/ghidra-dossier-project" \
            "aoe-rea-function-dossiers" \
            -import "$TARGET_PATH" \
            -scriptPath "$GITHUB_WORKSPACE/scripts/ghidra" \
            -postScript DecompileFunctionDossiers.java \
              "$GITHUB_WORKSPACE/$REPORT_DIR" \
              "$target_sha" \
              "$GITHUB_SHA" \
              "$TARGET_RELATIVE_PATH" \
              "$GHIDRA_VERSION" \
            -deleteProject

      - name: Validate batch checkpoints and publish counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import math
          from pathlib import Path

          root = Path("function-dossiers")
          index = root / "index.csv"
          count_path = root / "function-count.txt"
          if not index.is_file():
              raise SystemExit("Missing index.csv")
          if not count_path.is_file():
              raise SystemExit("Missing function-count.txt")
          expected = int(count_path.read_text(encoding="utf-8").strip())
          with index.open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          if not rows:
              raise SystemExit("No function entries were produced")
          indices = [int(row["index"]) for row in rows]
          if indices != list(range(expected)):
              raise SystemExit(
                  f"Index is incomplete or out of order: got {len(indices)} rows, expected {expected} "
                  "contiguous indices starting at zero."
              )
          missing = [row["note_file"] for row in rows if not (root / row["note_file"]).is_file()]
          if missing:
              raise SystemExit(f"{len(missing)} function note files are missing; first: {missing[:5]}")
          status = {}
          for row in rows:
              status[row["decompile_status"]] = status.get(row["decompile_status"], 0) + 1
          batch_size = 100
          batch_count = math.ceil(len(rows) / batch_size)
          last_batch_size = len(rows) % batch_size or batch_size
          lines = [
              "## Function dossier generation",
              "",
              f"- Target SHA-256: {(root / 'target-sha256.txt').read_text().strip()}",
              f"- Function entries indexed: **{len(rows)} / {expected}**",
              f"- Markdown notes verified: **{len(rows) - len(missing)} / {len(rows)}**",
              f"- Batch size: **{batch_size} functions**",
              f"- Batches completed: **{batch_count}** (last batch: {last_batch_size} functions)",
              "- Execution: Ghidra parallel decompiler with a reusable decompiler pool.",
              "- Index checkpoint: flushed after each completed batch.",
              f"- Decompilation succeeded: **{status.get('ok', 0)}**",
              f"- Decompilation failed: **{status.get('failed', 0)}**",
              f"- External entries: **{status.get('external', 0)}**",
              "- Notes are automatic static-analysis output; they are not behaviorally validated.",
          ]
          print("\n".join(lines))
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Upload function notes and index
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aoe-rea-function-dossiers
          path: function-dossiers/
          if-no-files-found: warn
          retention-days: 30
